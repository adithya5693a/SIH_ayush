    // --- RAG DIAGNOSTIC RUNNERS ---
    function runNationalDiagnostic(answers) {
      const { category, processingMethod, entityType } = answers;
      let classification = "Patent & Proprietary (P&P) Medicine";
      let regulatoryRoute = "Drugs and Cosmetics Act, Rule 158B (Licensing via SLA)";
      let clinicalProof = "Requires published safety data or pilot clinical trial reports per Rule 158B.";
      let patentPosture = "Medium Risk under § 3(p). Overcome by proving synergy (CI < 0.7) or novel delivery vehicle.";
      let patentRiskLevel = "AMBER";
      let absRequired = "Mandatory NBA Form III approval prior to patent grant at IPO.";
      let absForm = "NBA Form III";

      if (category === "classical") {
        classification = "Classical Ayurvedic Medicine (Shastriya Yoga)";
        regulatoryRoute = "Manufactured strictly per 54 authoritatively listed texts (First Schedule, D&C Act).";
        clinicalProof = "Exempt from clinical trials; requires classical citations + API pharmacopoeial compliance.";
        patentPosture = "ABSOLUTE BAR under Section 3(p). Traditional classical formulations cannot be patented.";
        patentRiskLevel = "RED";
        absRequired = entityType === "foreign" ? "Mandatory NBA Form I approval." : "Exempt from domestic ABS benefit sharing under BDA 2023 § 7.";
        absForm = entityType === "foreign" ? "NBA Form I" : "SBB Intimation (Exempted)";
      } else if (category === "ayurveda_aahar") {
        classification = "Ayurveda Aahar (Nutraceutical / Food)";
        regulatoryRoute = "FSSAI (Ayurveda Aahar) Regulations, 2022 (Schedule A recipes).";
        clinicalProof = "Must carry mandatory 'Ayurveda Aahar' emblem; no therapeutic disease claims allowed.";
        patentPosture = "Barred under Section 3(p) if simple food/herb mix. Patentable only for novel delivery matrix.";
        patentRiskLevel = "AMBER";
        absRequired = entityType === "foreign" ? "NBA Form I Approval" : "State Biodiversity Board (SBB) Intimation";
        absForm = entityType === "foreign" ? "NBA Form I" : "SBB Intimation";
      } else if (category === "phytopharmaceutical") {
        classification = "Phytopharmaceutical Drug (New Botanical Drug)";
        regulatoryRoute = "Drugs and Cosmetics Rules (Schedule Y / NDCT Rules 2019).";
        clinicalProof = "Requires HPLC/LC-MS chemical characterization, preclinical safety, and Phase I-III trials.";
        patentPosture = "HIGH PATENTABILITY POSTURE. Purified standardized bio-actives overcome § 3(p) and § 3(d).";
        patentRiskLevel = "GREEN";
        absRequired = "Mandatory NBA Form III approval prior to patent grant + Form I if foreign equity exists.";
        absForm = "NBA Form III + Form I";
      } else if (category === "cosmetic") {
        classification = "Ayurvedic Cosmetic (Saundarya Prasadana)";
        regulatoryRoute = "Drugs and Cosmetics Act, Schedule S / Ayurvedic Cosmetic Licensing.";
        clinicalProof = "Dermatological safety & stability testing; topical beautification claims only.";
        patentPosture = "High risk of § 3(p) rejection for known herbal skin actions. Requires novel skin-permeation vehicle.";
        patentRiskLevel = "AMBER";
        absRequired = "SBB Intimation / NBA Form III before patent filing.";
        absForm = "NBA Form III";
      }

      if (processingMethod === "nano_carrier") {
        patentPosture += " Novel lipid/nano carrier provides non-obvious technical step overcoming Section 3(p).";
        if (patentRiskLevel === "AMBER") patentRiskLevel = "GREEN";
      } else if (processingMethod === "novel_synergy") {
        patentPosture += " Combination Index (CI < 0.7) data establishes synergistic interaction overcoming Section 3(e).";
        if (patentRiskLevel === "AMBER") patentRiskLevel = "GREEN";
      }

      return { classification, regulatoryRoute, clinicalProof, patentPosture, patentRiskLevel, absRequired, absForm };
    }

    function runInternationalDiagnostic(answers) {
      const { treatyRoute, geneticDisclosure, priorArtStandard, exportCategory } = answers;
      let filingStrategy = "Patent Cooperation Treaty (PCT International Phase)";
      let gratkDisclosure = "Mandatory Country of Origin (India) & TK Declaration under WIPO GRATK Treaty Art. 3.";
      let foreignPriorArtRisk = "High scrutiny under USPTO 35 U.S.C. 102/103 & EPO Art 54/56 EPC via TKDL database access agreements.";
      let marketPathway = "US FDA Dietary Supplement (21 CFR 111) / EU THMPD (Directive 2004/24/EC).";

      if (treatyRoute === "direct_paris") filingStrategy = "Direct Paris Convention (12-Month Priority Window)";
      else if (treatyRoute === "madrid_system") filingStrategy = "WIPO Madrid System (International Trademark across 130+ Countries)";
      else if (treatyRoute === "hague_system") filingStrategy = "WIPO Hague System (Industrial Designs for Ayurvedic Packaging)";

      if (geneticDisclosure === "indian_origin_tk") {
        gratkDisclosure = "Mandatory disclosure: Patent specification MUST declare India as Country of Origin, cite traditional knowledge source, and cross-reference NBA Form III approval.";
      } else if (geneticDisclosure === "multi_country") {
        gratkDisclosure = "Multi-jurisdiction Nagoya Protocol compliance required. Obtain individual PIC/MAT agreements from each sovereign provider country.";
      }

      if (priorArtStandard === "uspto") {
        foreignPriorArtRisk = "USPTO examiners actively search TKDL. Must establish unexpected synergistic bio-activity and overcome 35 U.S.C. 101 subject matter eligibility.";
      } else if (priorArtStandard === "epo") {
        foreignPriorArtRisk = "EPO problem-solution approach requires comparative data proving technical effect beyond classical Ayurvedic texts cited in TKDL.";
      }

      if (exportCategory === "us_dietary_supplement") {
        marketPathway = "US FDA Dietary Supplement under DSHEA. Requires cGMP 21 CFR 111, structure/function disclaimer, and NDI notification if novel extract.";
      } else if (exportCategory === "eu_thmpd") {
        marketPathway = "EU Traditional Herbal Medicinal Product (THMPD Directive 2004/24/EC). Requires proof of 30 years medicinal use (at least 15 years in EU/India).";
      } else if (exportCategory === "eu_novel_food") {
        marketPathway = "EU Novel Food Regulation (Regulation 2015/2283). Requires comprehensive EFSA safety dossier for botanicals without EU history before May 1997.";
      } else if (exportCategory === "tga_australia") {
        marketPathway = "Australia TGA Listed Complementary Medicine (Therapeutic Goods Act 1989). Pre-approved herbal substances with evidence package.";
      }

      return { filingStrategy, gratkDisclosure, foreignPriorArtRisk, marketPathway };
    }

                      <h3 className="text-base font-bold text-stone-100 font-serif flex items-center gap-2">
                        <span className="w-6 h-6 rounded-full bg-amber-600 text-white flex items-center justify-center text-xs font-mono font-bold">{s.id}</span>
                        {s.title}
                      </h3>
                      <span className="text-xs font-mono text-amber-400">{t.step} {s.id} / 4</span>
                    </div>
                    <p className="text-xs text-stone-400">{s.desc}</p>

                    <div className="space-y-3 pt-2">
                      {s.options.map(opt => {
                        const isSelected = intlAnswers[s.key] === opt.id;
                        return (
                          <div
                            key={opt.id}
                            onClick={() => handleIntlSelect(s.key, opt.id)}
                            className={`p-4 rounded-xl border cursor-pointer transition ${
                              isSelected ? 'bg-amber-950/80 border-amber-400 ring-1 ring-amber-400' : 'bg-slate-950/60 border-slate-800 hover:border-amber-700'
                            }`}
                          >
                            <div className="flex items-start justify-between gap-3">
                              <div className="flex items-center gap-3">
                                <div className={`w-4 h-4 rounded-full border flex items-center justify-center mt-0.5 ${isSelected ? 'border-amber-400 bg-amber-500' : 'border-stone-600'}`}>
                                  {isSelected && <div className="w-1.5 h-1.5 rounded-full bg-slate-950"></div>}
                                </div>
                                <span className="font-semibold text-stone-100 text-sm">{opt.label}</span>
                              </div>
                              <span className="text-[10px] px-2 py-0.5 rounded font-mono font-semibold bg-amber-950 text-amber-300 border border-amber-700">{opt.badge}</span>
                            </div>
                            <p className="text-xs text-stone-400 mt-2 ml-7">{opt.desc}</p>
                          </div>
                        );
                      })}
                    </div>

                    <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                      <button disabled={intlStep === 1} onClick={() => setIntlStep(intlStep - 1)} className="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 text-stone-300 disabled:opacity-40">
                        {t.prevStep}
                      </button>
                      {intlStep < 4 ? (
                        <button onClick={() => setIntlStep(intlStep + 1)} className="px-5 py-2 rounded-lg text-xs font-semibold bg-amber-600 hover:bg-amber-500 text-white shadow">
                          {t.nextStep}
                        </button>
                      ) : (
                        <span className="text-xs font-mono text-amber-400 font-semibold">✓ International Evaluation Ready</span>
                      )}
                    </div>
                  </div>
                );
              })}

              {/* International Matrix Card */}
              <div className="bg-gradient-to-b from-slate-900 via-amber-950/40 to-slate-900 rounded-2xl p-6 border border-amber-700/50 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-amber-800/40 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">🌐</span>
                    <h3 className="font-serif font-bold text-stone-100 text-base">{t.liveEvaluation}</h3>
                  </div>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-amber-900 text-amber-300 border border-amber-700">WIPO / GLOBAL</span>
                </div>

                <div className="p-3.5 rounded-xl bg-slate-950/80 border border-amber-800/50 space-y-1">
                  <div className="text-[10px] font-mono uppercase text-amber-400 font-bold">{t.matrixLegalClass}</div>
                  <div className="text-sm font-bold text-stone-100">{intlResult.filingStrategy}</div>
                  <div className="text-xs text-stone-300 font-serif">{intlResult.marketPathway}</div>
                </div>

                <div className="p-3.5 rounded-xl bg-slate-950/80 border border-amber-800/50 space-y-1.5">
                  <div className="text-[10px] font-mono uppercase text-emerald-400 font-bold">{t.matrixIntlChecklist}</div>
                  <p className="text-xs text-stone-200 leading-relaxed font-sans">{intlResult.gratkDisclosure}</p>
                </div>

                <div className="p-3.5 rounded-xl bg-slate-950/80 border border-amber-800/50 space-y-1.5">
                  <div className="text-[10px] font-mono uppercase text-teal-400 font-bold">{t.matrixPatentPosture}</div>
                  <p className="text-xs text-stone-300 leading-relaxed">{intlResult.foreignPriorArtRisk}</p>
                </div>

                <button
                  onClick={() => handleSendChat(`How should I structure the PCT patent application and WIPO GRATK mandatory origin declaration for a ${intlResult.marketPathway} to withstand USPTO and EPO prior-art examination?`)}
                  className="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white font-semibold text-xs transition shadow-lg flex items-center justify-center gap-2"
                >
                  <span>{t.consultAiOnRoute}</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      // Advanced Deep-Dive View Renderer
      function renderAdvancedView() {
        const turnoverNum = Number(advTurnover) || 0;
        const calculatedFee = (turnoverNum * 100000 * 0.0015).toLocaleString('en-IN', { style: 'currency', currency: 'INR' });

        return (
          <div className="bg-slate-900/80 rounded-2xl p-6 border border-amber-800/50 shadow-xl space-y-4 animate-fadeIn">
            <h3 className="text-base font-bold text-stone-100 font-serif flex items-center gap-2">
              <span>🔬</span>
              <span>Advanced Regulatory & ABS Deep-Dive Calculations</span>
            </h3>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div className="p-4 rounded-xl bg-slate-950 border border-emerald-800/60 space-y-2">
                <div className="flex justify-between text-xs font-mono">
                  <span className="text-stone-300">Ex-Factory Gross Turnover:</span>
                  <span className="text-amber-400 font-bold">₹{turnoverNum} Lakhs</span>
                </div>
                <input
                  type="range" min="10" max="2000" step="10"
                  value={advTurnover} onChange={(e) => setAdvTurnover(Number(e.target.value))}
                  className="w-full accent-emerald-500 bg-slate-800 h-2 rounded-lg cursor-pointer"
                />
                <div className="text-xs text-stone-300 border-t border-slate-800 pt-2 flex justify-between">
                  <span>Estimated ABS Contribution:</span>
                  <span className="text-amber-400 font-bold">{calculatedFee}</span>
                </div>
              </div>

              <div className="p-4 rounded-xl bg-slate-950 border border-amber-800/60 text-xs text-stone-300 space-y-1">
                <strong className="text-amber-400">CITES Screening & Provenance:</strong>
                <p>Ensure species such as Saussurea costata, Nardostachys jatamansi, and Pterocarpus santalinus have Legal Procurement Certificates (LPC) before export.</p>
              </div>
            </div>
          </div>
        );
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
